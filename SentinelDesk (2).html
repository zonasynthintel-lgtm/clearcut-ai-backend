  async function saveLeaveRequest(personId) {
    const p = state.personnel.find(x => x.id === personId);
    if (!p) return;
    const start = document.getElementById('lv_start')?.value;
    if (!start) { toast('Start date is required', 'error'); return; }
    let end = document.getElementById('lv_end')?.value || start;
    if (end < start) {
      toast('End date cannot be earlier than start date', 'error');
      return;
    }
    const inclusiveDays = datesInRange(start, end).length;
    let daysRaw = document.getElementById('lv_days')?.value;
    let days = Number(daysRaw);
    if (daysRaw === '' || daysRaw == null || isNaN(days) || days <= 0) {
      // Auto-fill inclusive day count when blank/invalid
      days = inclusiveDays;
      const daysEl = document.getElementById('lv_days');
      if (daysEl) daysEl.value = String(days);
    }
    if (!Number.isFinite(days) || days <= 0) {
      toast('Requested days must be a positive number', 'error');
      return;
    }
    const extraRaw = document.getElementById('lv_extra')?.value;
    const extra = extraRaw === '' || extraRaw == null ? 0 : Number(extraRaw);
    if (!Number.isFinite(extra) || extra < 0) {
      toast('Additional days cannot be negative', 'error');
      return;
    }
    // Soft consistency: if user entered a day count that does not match the range, use the range count
    if (days !== inclusiveDays) {
      days = inclusiveDays;
      const daysEl = document.getElementById('lv_days');
      if (daysEl) daysEl.value = String(days);
    }
    const status = document.getElementById('lv_status')?.value || 'Pending';
    const approvedBy = document.getElementById('lv_by')?.value?.trim() || '';
    const remarks = document.getElementById('lv_remarks')?.value || '';
    if (extra > 0 && status === 'Approved' && !approvedBy) {
      toast('Approving authority required for additional approved days', 'error');
      return;
    }
    // Support create or update via data-leave-id on the save button
    const saveBtn = document.querySelector('[data-action="save-leave-request"]');
    const existingId = saveBtn?.dataset?.leaveId || '';
    const prev = existingId ? (state.leaveRequests || []).find(l => l.id === existingId) : null;
    const prevStatus = prev?.status || null;
    const actor = state.settings.supervisorName || 'Field Supervisor';
    const now = nowISO();

    const histEntry = {
      at: now,
      action: prev ? ('Status change') : ('Created'),
      previousStatus: prevStatus,
      newStatus: status,
      by: actor,
      approvedBy: approvedBy || null,
      remarks: remarks || null
    };

    const req = {
      id: prev?.id || uid(),
      personId,
      locationId: p.locationId || state.currentLocationId,
      requestDate: prev?.requestDate || now,
      startDate: start,
      endDate: end,
      days,
      additionalDays: extra,
      reason: document.getElementById('lv_reason')?.value || '',
      status,
      approvedBy,
      // Preserve first decision timestamps; record new decision time when status changes to Approved/Rejected
      approvalDate: (status === 'Approved' || status === 'Rejected')
        ? (prev && prev.status === status && prev.approvalDate ? prev.approvalDate : now)
        : (prev?.approvalDate || null),
      remarks,
      createdAt: prev?.createdAt || now,
      updatedAt: now,
      syncCompleted: false,
      history: (prev?.history || []).concat([histEntry])
    };
    // Save request first (before attendance sync)
    await put('leaveRequests', req);
    state.leaveRequests = state.leaveRequests || [];
    if (prev) {
      const idx = state.leaveRequests.findIndex(l => l.id === req.id);
      if (idx >= 0) state.leaveRequests[idx] = req;
      else state.leaveRequests.push(req);
    } else {
      state.leaveRequests.push(req);
    }
    // Synchronise attendance; mark completion for recovery on startup
    try {
      const ok = await syncAttendanceFromLeave(req);
      req.syncCompleted = !!ok;
      req.syncCompletedAt = nowISO();
      await put('leaveRequests', req);
      const ix = state.leaveRequests.findIndex(l => l.id === req.id);
      if (ix >= 0) state.leaveRequests[ix] = req;
    } catch (syncErr) {
      req.syncCompleted = false;
      req.syncError = String(syncErr && syncErr.message ? syncErr.message : syncErr);
      await put('leaveRequests', req);
      console.error('Leave attendance sync failed', syncErr);
      toast('Request saved, but attendance sync needs retry on next launch', 'warning');
    }
    closeModal();
    toast('Leave/off-day request ' + (prev ? 'updated' : 'saved') + ' (' + status + ')', 'success');
    if (state.currentPage === 'people') {
      state.selectedPersonId = personId;
      if (state.personTab !== 'attendance' && state.personTab !== 'performance') {
        state.personTab = 'attendance';
      }
    }
    renderPage();
  }

  /** Retry leave→attendance sync for requests that did not complete successfully. Safe: only leave_sync rows. */
  async function recoverIncompleteLeaveSyncs() {
    const pending = (state.leaveRequests || []).filter(l => l.syncCompleted === false);
    if (!pending.length) return;
    let recovered = 0;
    for (const req of pending) {
      try {
        const ok = await syncAttendanceFromLeave(req);
        req.syncCompleted = !!ok;
        req.syncCompletedAt = nowISO();
        req.syncError = null;
        await put('leaveRequests', req);
        recovered++;
      } catch (e) {
        console.error('Leave sync recovery failed for', req.id, e);
      }
    }
    if (recovered) console.log('Recovered leave attendance sync for', recovered, 'request(s)');
  }



  // ========== PERFORMANCE ANALYTICS ==========
  const PERF_CLASS_OPTIONS = [
    { id: 'positive', label: 'Positive observation' },
    { id: 'compliment', label: 'Compliment / commendation' },
    { id: 'negative', label: 'Negative observation' },
    { id: 'complaint', label: 'Complaint' },
    { id: 'allegation', label: 'Allegation requiring investigation' },
    { id: 'verified_issue', label: 'Verified performance issue' },
    { id: 'disciplinary', label: 'Disciplinary or management decision' },
    { id: 'neutral', label: 'Neutral operational record' },
    { id: 'other', label: 'Other' }
  ];
  const PERF_VERIFY_OPTIONS = [
    { id: 'unverified', label: 'Reported but unverified' },
    { id: 'investigating', label: 'Under investigation' },
    { id: 'verified', label: 'Verified' },
    { id: 'not_substantiated', label: 'Not substantiated' },
    { id: 'resolved', label: 'Resolved' },
    { id: 'management_decision', label: 'Management decision recorded' }
  ];

  function suggestPerformanceClass(text) {
    const t = String(text || '').toLowerCase();
    if (!t.trim()) return { id: 'neutral', confidence: 0, note: 'No description to analyse' };
    const pos = ['compliment', 'commendation', 'excellent', 'outstanding', 'professional', 'punctual', 'initiative', 'alertness', 'well done', 'good work', 'appreciation', 'recognition', 'compliance', 'reliable'];
    const neg = ['negligence', 'abandon', 'abscond', 'misconduct', 'poor conduct', 'lateness', 'late for', 'failed to', 'failure to', 'unauthorized absence', 'unauthorised absence', 'sleeping on duty', 'dereliction'];
    const complaint = ['complaint', 'complain', 'allegation', 'accused', 'accused of'];
    let scorePos = 0, scoreNeg = 0, scoreComp = 0;
    pos.forEach(w => { if (t.includes(w)) scorePos++; });
    neg.forEach(w => { if (t.includes(w)) scoreNeg++; });
    complaint.forEach(w => { if (t.includes(w)) scoreComp++; });
    if (scoreComp > 0 && scoreNeg >= scorePos) return { id: 'allegation', confidence: 0.7, note: 'Language suggests a complaint/allegation — confirm before treating as verified' };
    if (scoreNeg > scorePos) return { id: 'negative', confidence: 0.65, note: 'Language suggests a negative observation — supervisor must confirm' };
    if (scorePos > scoreNeg) return { id: 'positive', confidence: 0.65, note: 'Language suggests a positive observation' };
    return { id: 'neutral', confidence: 0.4, note: 'No strong performance language detected — default neutral' };
  }

  function getReportPerfClass(r) {
    if (r.performanceClass) return r.performanceClass;
    if (r.data?.performanceClass) return r.data.performanceClass;
    // Heuristic from title/description for older records
    const blob = (r.title || '') + ' ' + Object.values(r.data || {}).join(' ');
    return suggestPerformanceClass(blob).id;
  }
  function getReportVerify(r) {
    return r.verificationStatus || r.data?.verificationStatus || 'unverified';
  }

  function filterByPerfPeriod(reports, periodKey, custom) {
    const range = resolveExportDateRange(periodKey || 'all', custom || {});
    return filterReportsByDate(reports, range);
  }

  function analysePersonPerformance(personId, periodKey) {
    const all = getPersonReports(personId);
    const period = periodKey || state.perfPeriod || '30d';
    const range = resolveExportDateRange(period, {});
    const reports = filterReportsByDate(all, range);
    const buckets = {
      positive: [], compliment: [], negative: [], complaint: [], allegation: [],
      verified_issue: [], disciplinary: [], neutral: [], other: []
    };
    reports.forEach(r => {
      const c = getReportPerfClass(r);
      if (buckets[c]) buckets[c].push(r);
      else buckets.other.push(r);
    });
    const verifiedNeg = reports.filter(r => {
      const c = getReportPerfClass(r);
      const v = getReportVerify(r);
      return (c === 'verified_issue' || c === 'disciplinary' || (c === 'negative' && v === 'verified') || (c === 'complaint' && v === 'verified'));
    });
    const unverifiedAlleg = reports.filter(r => {
      const c = getReportPerfClass(r);
      const v = getReportVerify(r);
      return (c === 'allegation' || c === 'complaint') && (v === 'unverified' || v === 'investigating');
    });
    const resolved = reports.filter(r => getReportVerify(r) === 'resolved' || getReportVerify(r) === 'not_substantiated');
    const positives = [...buckets.positive, ...buckets.compliment];
    const negatives = [...buckets.negative, ...buckets.complaint, ...buckets.verified_issue, ...buckets.disciplinary];

    // Transparent score: only verified items and positives; unverified allegations excluded from penalty
    // Score 50 baseline; +8 per positive (max +40); -10 per verified issue (max -40); resolved +2 each (max +10)
    let score = null;
    let scoreNote = '';
    const signalCount = positives.length + verifiedNeg.length + buckets.compliment.length;
    if (reports.length === 0 || signalCount === 0 && buckets.neutral.length === reports.length) {
      score = null;
      scoreNote = 'INSUFFICIENT DATA FOR A RELIABLE PERFORMANCE ASSESSMENT.';
    } else if (positives.length + verifiedNeg.length + unverifiedAlleg.length === 0) {
      score = null;
      scoreNote = 'INSUFFICIENT DATA FOR A RELIABLE PERFORMANCE ASSESSMENT. Only neutral operational records in this period.';
    } else {
      score = 50;
      score += Math.min(40, positives.length * 8);
      score -= Math.min(40, verifiedNeg.length * 10);
      score += Math.min(10, resolved.length * 2);
      // Unverified allegations do NOT reduce score
      score = Math.max(0, Math.min(100, score));
      scoreNote = 'Baseline 50. +8 per positive/compliment (cap +40). −10 per verified issue/disciplinary (cap −40). +2 per resolved/not-substantiated (cap +10). Unverified allegations are excluded from the score.';
    }

    let trendLabel = 'Insufficient information';
    if (score === null) trendLabel = 'Insufficient information for assessment';
    else if (verifiedNeg.length >= 3) trendLabel = 'Repeated verified concerns';
    else if (verifiedNeg.length >= 1 && positives.length === 0) trendLabel = 'Attention required';
    else if (positives.length > verifiedNeg.length && score >= 60) trendLabel = 'Positive performance trend';
    else if (positives.length > 0 && verifiedNeg.length > 0) trendLabel = 'Mixed — improvement possible';
    else if (score >= 55) trendLabel = 'Consistent performance';
    else trendLabel = 'Attention required';

    // Monthly trend (last 6 months keys)
    const monthly = {};
    reports.forEach(r => {
      const mk = monthKey(new Date(r.eventAt || r.createdAt));
      if (!monthly[mk]) monthly[mk] = { positive: 0, negative: 0, verified: 0, allegation: 0 };
      const c = getReportPerfClass(r);
      if (c === 'positive' || c === 'compliment') monthly[mk].positive++;
      if (c === 'negative' || c === 'complaint' || c === 'verified_issue' || c === 'disciplinary') monthly[mk].negative++;
      if (getReportVerify(r) === 'verified' && (c === 'complaint' || c === 'negative' || c === 'verified_issue')) monthly[mk].verified++;
      if (c === 'allegation' || (c === 'complaint' && getReportVerify(r) === 'unverified')) monthly[mk].allegation++;
    });

    return {
      reports, buckets, positives, negatives, verifiedNeg, unverifiedAlleg, resolved,
      score, scoreNote, trendLabel, monthly, range, period
    };
  }

  function analyseAssetPerformance(assetId, periodKey) {
    const all = getAssetReports(assetId);
    const period = periodKey || state.assetPerfPeriod || '30d';
    const range = resolveExportDateRange(period, {});
    const reports = filterReportsByDate(all, range);
    const faults = reports.filter(r => r.type === 'fault' || /fault|breakdown|failed/i.test(r.title || '') || r.data?.condition === 'Faulty');
    const maint = reports.filter(r => r.type === 'maintenance' || /maint/i.test(r.title || ''));
    const readings = reports.filter(r => r.type === 'reading');
    const openIssues = reports.filter(r => r.status === 'Open' || r.status === 'Pending');
    const exp = (state.expenses || []).filter(e => e.assetId === assetId);
    const expInRange = filterReportsByDate(exp.map(e => ({ ...e, eventAt: e.date || e.createdAt, createdAt: e.createdAt })), range);
    const repairSpend = expInRange.reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const asset = state.assets.find(a => a.id === assetId);
    let indicator = 'Insufficient information';
    if (reports.length === 0 && !repairSpend) indicator = 'Insufficient information';
    else if (openIssues.some(r => r.priority === 'Critical') || (asset && asset.condition === 'Faulty')) indicator = 'Unresolved critical defect / attention required';
    else if (faults.length >= 3) indicator = 'Repeated faults detected';
    else if (repairSpend > 50000) indicator = 'High maintenance expenditure';
    else if (faults.length >= 1 || (asset && asset.condition === 'Service Due')) indicator = 'Maintenance attention required';
    else if (asset && (asset.condition === 'Good' || asset.condition === 'Operational')) indicator = 'Good operating condition';
    else indicator = 'Consistent operational records';
    return { reports, faults, maint, readings, openIssues, repairSpend, indicator, range, period, asset };
  }

  function renderAttention() {
    let open = state.alerts.filter(a => a.status === 'open' && (state.searchAcrossLocations || a.locationId === state.currentLocationId))
      .sort((a, b) => {
        const sev = { critical: 0, warning: 1, info: 2 };
        return (sev[a.severity] ?? 3) - (sev[b.severity] ?? 3) || new Date(b.createdAt) - new Date(a.createdAt);
      });
    if (state.filters.severity) open = open.filter(a => a.severity === state.filters.severity);
    const closed = state.alerts.filter(a => a.status !== 'open').slice(0, 15);

    return `
      <div class="page active">
        <div class="page-header">
          <h1 class="page-title">Attention Centre</h1>
          <p class="page-desc">Warnings, critical alerts and matters that need follow-up. Acknowledge or resolve when handled.</p>
        </div>
        ${renderActiveFilters()}
        <div class="stats-grid grid-diesel">
          <button class="stat-card critical" data-action="stat-nav" data-target="attention" data-filter='{"severity":"critical"}'><div class="stat-label">Critical</div><div class="stat-value">${open.filter(a => a.severity === 'critical').length}</div></button>
          <button class="stat-card warning" data-action="stat-nav" data-target="attention" data-filter='{"severity":"warning"}'><div class="stat-label">Warnings</div><div class="stat-value">${open.filter(a => a.severity === 'warning').length}</div></button>
          <button class="stat-card info" data-action="stat-nav" data-target="attention" data-filter='{"severity":"info"}'><div class="stat-label">Informational</div><div class="stat-value">${open.filter(a => a.severity === 'info').length}</div></button>

                const loc = state.locations.find(l => l.id === a.locationId);
                return `
                <div class="list-item severity-${a.severity}" style="align-items:flex-start">

                    <div class="list-meta">${escapeHtml(a.reason)}</div>
                    <div class="list-meta mt-1">${escapeHtml(loc?.name || '')} · ${formatDateTime(a.createdAt)}</div>

                      ${a.relatedType === 'report' ? `<button class="btn btn-sm btn-ghost" data-action="view-report" data-id="${a.relatedId}">View Report</button>` : ''}
                    </div>
                  </div>
                </div>`;
              }).join('')}
          </div>
        </div>
        ${closed.length ? `<div class="card"><div class="card-header"><span class="card-title">Recently Resolved / Acknowledged</span></div>
          <div class="card-body">${closed.map(a => `
            <div class="list-item"><div class="list-content">

            </div></div>`).join('')}

  function renderInsights() {
    const reports = filterByLocation(state.reports);
    const byType = {};
    REPORT_TYPES.forEach(t => byType[t.id] = 0);
    reports.forEach(r => { byType[r.type] = (byType[r.type] || 0) + 1; });
    const maxType = Math.max(1, ...Object.values(byType));
    const last7 = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0, 0, 0, 0);
      const next = new Date(d); next.setDate(next.getDate() + 1);
      const count = reports.filter(r => { const t = new Date(r.createdAt); return t >= d && t < next; }).length;
      last7.push({ label: d.toLocaleDateString('en-GB', { weekday: 'short' }), count });
    }
    const maxDay = Math.max(1, ...last7.map(d => d.count));

    return `
      <div class="page active">
        <div class="page-header">
          <h1 class="page-title">Insights</h1>
          <p class="page-desc">Statistics and trends calculated from your saved records.</p>

            <button class="btn btn-secondary" data-action="export-json">Full JSON Backup</button>
            <button class="btn btn-secondary" data-action="export-csv">Reports CSV</button>
          </div>

          <div class="stat-card"><div class="stat-label">Total Reports</div><div class="stat-value">${reports.length}</div></div>
          <div class="stat-card"><div class="stat-label">Personnel</div><div class="stat-value">${filterByLocation(state.personnel).length}</div></div>
          <div class="stat-card"><div class="stat-label">Assets</div><div class="stat-value">${filterByLocation(state.assets).length}</div></div>
          <div class="stat-card"><div class="stat-label">Open Alerts</div><div class="stat-value">${state.alerts.filter(a => a.status === 'open').length}</div></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Personnel performance (site, last 30 days)</span></div>
          <div class="card-body">
            <p class="help-text">Summary only. Open an individual profile → Performance tab for full analytics. Unverified allegations are not treated as proven misconduct.</p>
            ${filterByLocation(state.personnel).filter(p => p.active !== false && p.status !== 'Archived').slice(0, 12).map(p => {

  function renderConfigLocations() {
    const active = state.locations.filter(l => l.active !== false);
    const archived = state.locations.filter(l => l.active === false);
    const siteCard = (l) => {
      const pCount = state.personnel.filter(p => p.locationId === l.id).length;
      const aCount = state.assets.filter(a => a.locationId === l.id).length;
      const rCount = state.reports.filter(r => r.locationId === l.id).length;
      const isActive = l.active !== false;
      return `<div class="site-card">
        <div class="site-card-info">
          <strong>${escapeHtml(l.name)}</strong>
          ${l.code ? ` <span class="text-sm text-secondary">(${escapeHtml(l.code)})</span>` : ''}
          <div class="text-sm text-secondary">${escapeHtml(l.address || '')}</div>
          <div class="site-card-stats mt-1">
            <span>${pCount} personnel</span>
            <span>${aCount} assets</span>
            <span>${rCount} reports</span>
            <span class="badge badge-${isActive ? 'success' : 'neutral'}">${isActive ? 'Active' : 'Archived'}</span>
          </div>
        </div>
        <div class="site-card-actions">
          <button class="btn btn-sm btn-secondary" data-action="edit-location" data-id="${l.id}">Edit</button>
          ${isActive
            ? `<button class="btn btn-sm btn-ghost" data-action="archive-location" data-id="${l.id}">Archive</button>
               <button class="btn btn-sm btn-ghost" data-action="delete-location" data-id="${l.id}">Delete</button>`
            : `<button class="btn btn-sm btn-primary" data-action="restore-location" data-id="${l.id}">Restore</button>
               <button class="btn btn-sm btn-ghost" data-action="delete-location" data-id="${l.id}">Delete</button>`}
        </div>
      </div>`;
    };
    return `<div class="card"><div class="card-header"><span class="card-title">Site Management</span>
      <button class="btn btn-sm btn-primary" data-action="add-location">+ Add Site</button></div>
      <div class="card-body">
        <p class="help-text">Edit a site to rename it — the ID stays the same so all linked records remain connected. Archive sites you no longer operate; history is kept. Permanent delete is only allowed when a site has no linked records.</p>
        <h4 class="mb-2">Active sites</h4>
        ${active.length ? active.map(siteCard).join('') : '<p class="text-secondary">No active sites.</p>'}
        ${archived.length ? `<h4 class="mt-2 mb-2">Archived sites</h4>${archived.map(siteCard).join('')}` : ''}
      </div></div>`;
  }

  function startReportWizard(type, prefill = {}) {
    state.reportWizard = {
      step: 1,
      type,
      data: { ...prefill },
      personId: prefill.personId || null,
      assetId: prefill.assetId || null,
      performanceClass: prefill.performanceClass || 'neutral',
      verificationStatus: prefill.verificationStatus || 'unverified'
    };
    renderReportWizard();
  }

  function renderReportWizard() {
    const w = state.reportWizard;
    const typeInfo = w.type.startsWith('custom_')
      ? { name: state.customSections.find(s => 'custom_' + s.id === w.type)?.name || 'Custom', icon: '📑' }
      : REPORT_TYPES.find(t => t.id === w.type) || { name: w.type, icon: '📄' };

    let body = '';
    if (w.step === 1) {
      body = `
        <div class="step-indicator"><div class="step active"></div><div class="step"></div><div class="step"></div></div>
        <p class="help-text">Step 1 of 3 — Basic details. Submission time is recorded automatically when you save.</p>
        <p class="mb-2">Report type: <strong>${escapeHtml(typeInfo.name)}</strong></p>
        <div class="form-group"><label class="form-label">Title / Summary <span class="req">*</span></label>
          <input class="form-control" id="rw_title" value="${escapeHtml(w.data.title || '')}" placeholder="e.g. Perimeter light failure"></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Event Date & Time</label>
            <input class="form-control" type="datetime-local" id="rw_eventAt" value="${w.data.eventAt || new Date().toISOString().slice(0, 16)}"></div>
          <div class="form-group"><label class="form-label">Priority</label>
            <select class="form-control" id="rw_priority">
              <option value="Low">Low</option><option value="Medium" selected>Medium</option>
              <option value="High">High</option><option value="Critical">Critical</option>
            </select></div>
        </div>
        <div class="form-group"><label class="form-label">Location</label>
          <select class="form-control" id="rw_locationId">
            ${state.locations.map(l => `<option value="${l.id}" ${l.id === (w.data.locationId || state.currentLocationId) ? 'selected' : ''}>${escapeHtml(l.name)}</option>`).join('')}
          </select></div>`;
    } else if (w.step === 2) {
      body = `
        <div class="step-indicator"><div class="step done"></div><div class="step active"></div><div class="step"></div></div>
        <p class="help-text">Step 2 of 3 — Select people and equipment already registered in SentinelDesk. Type to filter the lists. You can skip if not applicable.</p>
        <div class="form-group"><label class="form-label">Search & select personnel</label>
          <input class="form-control" type="search" id="rw_personSearch" placeholder="Type name or staff ID to filter…">
          <select class="form-control mt-1" id="rw_personId" size="4" style="min-height:100px">
            <option value="">— None / not applicable —</option>
            ${state.personnel.filter(p => p.active !== false && p.status !== 'Archived').map(p => `<option value="${p.id}" ${p.id === w.personId ? 'selected' : ''}>${escapeHtml(p.fullName)} · ${escapeHtml(p.staffId)} · ${escapeHtml(p.designation || '')}</option>`).join('')}
          </select>
          <p class="form-hint">Select one primary person for this report. They will appear on the personnel profile history.</p></div>
        <div class="form-group"><label class="form-label">Performance / conduct classification ${infoBtn('performanceClass')}</label>
          <select class="form-control" id="rw_perfClass">
            ${PERF_CLASS_OPTIONS.map(o => `<option value="${o.id}" ${o.id === (w.performanceClass || 'neutral') ? 'selected' : ''}>${o.label}</option>`).join('')}
          </select>
          <p class="form-hint" id="rw_perfSuggest">Used for Performance & Conduct Analytics when a staff member is linked. Allegations stay unverified until you set verification status.</p></div>
        <div class="form-group"><label class="form-label">Verification status ${infoBtn('verification')}</label>
          <select class="form-control" id="rw_perfVerify">
            ${PERF_VERIFY_OPTIONS.map(o => `<option value="${o.id}" ${o.id === (w.verificationStatus || 'unverified') ? 'selected' : ''}>${o.label}</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Search & select asset / equipment</label>
          <input class="form-control" type="search" id="rw_assetSearch" placeholder="Type asset name, ID or category…">
          <select class="form-control mt-1" id="rw_assetId" size="4" style="min-height:100px">
            <option value="">— None / not applicable —</option>
            ${state.assets.filter(a => a.active !== false).map(a => `<option value="${a.id}" ${a.id === w.assetId ? 'selected' : ''}>${escapeHtml(a.name)} · ${escapeHtml(a.assetId)} · ${escapeHtml(a.category)} · ${escapeHtml(a.condition || '')}</option>`).join('')}
          </select></div>
        ${renderTypeSpecificFields(w.type, w.data)}`;
    } else {
      body = `
        <div class="step-indicator"><div class="step done"></div><div class="step done"></div><div class="step active"></div></div>
        <p class="help-text">Step 3 of 3 — Review and submit. A unique reference number will be generated.</p>
        <div class="card" style="background:var(--surface-2)"><div class="card-body">
          <p><strong>Type:</strong> ${escapeHtml(typeInfo.name)}</p>
          <p><strong>Title:</strong> ${escapeHtml(w.data.title || '')}</p>
          <p><strong>Event:</strong> ${formatDateTime(w.data.eventAt)}</p>
          <p><strong>Priority:</strong> ${escapeHtml(w.data.priority || 'Medium')}</p>
        </div></div>`;
    }

    openModal(`New Report — ${typeInfo.name}`, body, `
      ${w.step > 1 ? '<button class="btn btn-secondary" data-action="rw-back">Back</button>' : '<button class="btn btn-secondary" data-action="close-modal">Cancel</button>'}
      ${w.step < 3 ? '<button class="btn btn-primary" data-action="rw-next">Next</button>' : '<button class="btn btn-primary" data-action="rw-submit">Submit Report</button>'}
    `, true);
  }

  function renderTypeSpecificFields(type, data = {}) {
    if (type.startsWith('custom_')) {
      const section = state.customSections.find(s => 'custom_' + s.id === type);
      if (!section?.fields) return '<p class="text-secondary">No fields defined.</p>';
      return section.fields.map(f => {
        const req = f.required ? '<span class="req">*</span>' : '';
        const helpIcon = (f.help || f.example) ? infoBtn(f.help || ('Enter: ' + f.label), f.example || '') : infoBtn('Enter the value for: ' + f.label, f.example || '');
        const ph = f.example ? ` placeholder="${escapeHtml(f.example)}"` : '';
        if (f.type === 'longtext') return `<div class="form-group"><label class="form-label">${escapeHtml(f.label)} ${req} ${helpIcon}</label><textarea class="form-control" id="rwf_${f.key}"${ph}>${escapeHtml(data[f.key] || '')}</textarea></div>`;
        if (f.type === 'dropdown') return `<div class="form-group"><label class="form-label">${escapeHtml(f.label)} ${req} ${helpIcon}</label><select class="form-control" id="rwf_${f.key}"><option value="">Select…</option>${(f.options || []).map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select></div>`;
        if (f.type === 'yesno') return `<div class="form-group"><label class="form-label">${escapeHtml(f.label)} ${req} ${helpIcon}</label><select class="form-control" id="rwf_${f.key}"><option value="Yes">Yes</option><option value="No">No</option></select></div>`;

  function collectWizardData() {
    const w = state.reportWizard;
    if (w.step === 1) {
      w.data.title = document.getElementById('rw_title')?.value?.trim();
      w.data.eventAt = document.getElementById('rw_eventAt')?.value;
      w.data.priority = document.getElementById('rw_priority')?.value;
      w.data.locationId = document.getElementById('rw_locationId')?.value;
      if (!w.data.title) { toast('Title is required', 'error'); return false; }
    } else if (w.step === 2) {
      const pid = document.getElementById('rw_personId')?.value;
      const aid = document.getElementById('rw_assetId')?.value;
      w.personId = pid || null;
      w.assetId = aid || null;
      w.performanceClass = document.getElementById('rw_perfClass')?.value || w.performanceClass || 'neutral';
      w.verificationStatus = document.getElementById('rw_perfVerify')?.value || w.verificationStatus || 'unverified';
      document.querySelectorAll('[id^="rwf_"]').forEach(el => {
        const key = el.id.replace('rwf_', '');
        w.data[key] = el.type === 'checkbox' ? el.checked : el.value;
      });
    }
    // Always re-read classification controls if present (defensive)
    if (document.getElementById('rw_perfClass')) {
      w.performanceClass = document.getElementById('rw_perfClass').value || w.performanceClass || 'neutral';
    }
    if (document.getElementById('rw_perfVerify')) {
      w.verificationStatus = document.getElementById('rw_perfVerify').value || w.verificationStatus || 'unverified';
    }
    if (document.getElementById('rw_personId')) {
      w.personId = document.getElementById('rw_personId').value || null;
    }
    return true;
  }

  async function submitReport() {
    const w = state.reportWizard;
    const typeInfo = w.type.startsWith('custom_') ? state.customSections.find(s => 'custom_' + s.id === w.type) : null;
    // Prefer live DOM if still on step 2; otherwise use values collected into wizard state
    const liveClass = document.getElementById('rw_perfClass')?.value;
    const liveVerify = document.getElementById('rw_perfVerify')?.value;
    const livePerson = document.getElementById('rw_personId')?.value;
    const liveAsset = document.getElementById('rw_assetId')?.value;
    if (livePerson !== undefined && livePerson !== null && document.getElementById('rw_personId')) {
      w.personId = livePerson || null;
    }
    if (liveAsset !== undefined && liveAsset !== null && document.getElementById('rw_assetId')) {
      w.assetId = liveAsset || null;
    }
    const perfClass = liveClass || w.performanceClass || 'neutral';
    const perfVerify = liveVerify || w.verificationStatus || 'unverified';
    w.performanceClass = perfClass;
    w.verificationStatus = perfVerify;
    // Allegations cannot be saved as verified without investigation
    let verificationStatus = perfVerify;
    if (perfClass === 'allegation' && verificationStatus === 'verified') {
      verificationStatus = 'investigating';
    }
    // Custom required-field validation
    if (typeInfo?.fields?.length) {
      for (const f of typeInfo.fields) {
        if (f.required) {
          const val = w.data?.[f.key];
          if (val == null || String(val).trim() === '') {
            toast('Required field missing: ' + (f.label || f.key), 'error');
            return;
          }
        }
      }
    }
    const personId = w.personId || null;
    const assetId = w.assetId || null;
    const report = {
      id: uid(),
      ref: refNo(w.type === 'incident' ? 'INC' : w.type === 'ob' ? 'OB' : 'RPT'),
      type: w.type,
      title: w.data.title,
      locationId: w.data.locationId || state.currentLocationId,
      personId: personId,
      assetId: assetId,
      eventAt: w.data.eventAt ? new Date(w.data.eventAt).toISOString() : nowISO(),
      createdAt: nowISO(),
      status: 'Open',
      priority: w.data.priority || 'Medium',
      performanceClass: perfClass,
      verificationStatus: verificationStatus,
      data: { ...w.data, performanceClass: perfClass, verificationStatus },
      customSectionId: typeInfo ? typeInfo.id : null,
      history: [{ at: nowISO(), action: 'Created', by: state.settings.supervisorName || 'Field Supervisor', performanceClass: perfClass, verificationStatus }]
    };
    await put('reports', report);
    state.reports.push(report);

    if ((w.type === 'reading' || w.data.readingType === 'Diesel') && w.assetId) {
      const asset = state.assets.find(a => a.id === w.assetId);
      if (asset && asset.category === 'Generator' && w.data.value != null) {
        const reading = { id: uid(), value: Number(w.data.value), unit: '%', type: 'diesel', recordedAt: report.eventAt, note: w.data.notes || w.data.description || '' };
        asset.readings = asset.readings || [];
        asset.readings.push(reading);
        asset.dieselLevel = reading.value;
        asset.updatedAt = nowISO();
        await put('assets', asset);
        const alertData = evaluateAssetReading(asset, reading);
        if (alertData) await createAlert(alertData);
      }
    }
    await runCustomRules(report);
    // If custom section is financial, record linked expense/income (once, not double with fuel)
    if (report.customSectionId) {
      const sec = state.customSections.find(s => s.id === report.customSectionId);
      if (sec && (sec.financialClass === 'expense' || sec.financialClass === 'income' || sec.financialClass === 'both')) {
        const amount = Number(report.data?.amount);
        if (!isNaN(amount) && amount >= 0) {
          const kind = sec.financialClass === 'income' ? 'income' :
            (sec.financialClass === 'both' && String(report.data?.transaction_type || '').toLowerCase().includes('income') ? 'income' : 'expense');
          const expense = {
            id: uid(), ref: refNo(kind === 'income' ? 'INC' : 'EXP'),
            category: sec.name, amount, date: report.data?.transaction_date || report.eventAt || nowISO(),
            locationId: report.locationId, assetId: report.assetId, personId: report.personId,
            description: report.title || sec.name, txKind: kind,
            reportId: report.id, customSectionId: sec.id,
            status: 'Recorded', createdAt: nowISO(),
            history: [{ at: nowISO(), action: 'Created from report ' + report.ref, by: state.settings.supervisorName || 'Field Supervisor' }]
          };
          await put('expenses', expense);
          state.expenses.push(expense);
        }
      }
    }
    closeModal();
    toast('Report ' + report.ref + ' submitted' + (personId ? ' · linked to staff profile' : ''), 'success');
    updateAttentionBadge();
    // If report is linked to a person currently being viewed, stay on their Performance tab
    if (personId && state.currentPage === 'people' && state.selectedPersonId === personId) {
      state.personTab = 'performance';
      renderPage();
    } else if (personId && state.currentPage === 'people' && !state.selectedPersonId) {
      // Open the linked person's performance tab so recording is visible immediately
      state.selectedPersonId = personId;
      state.personTab = 'performance';
      renderPage();
    } else if (['records', 'overview', 'people', 'assets'].includes(state.currentPage)) {
      renderPage();
    }
  }

  function viewReport(id) {
    const r = state.reports.find(x => x.id === id);
    if (!r) return;
    const loc = state.locations.find(l => l.id === r.locationId);
    const person = state.personnel.find(p => p.id === r.personId);
    const asset = state.assets.find(a => a.id === r.assetId);
    const currentClass = getReportPerfClass(r);
    const currentVerify = getReportVerify(r);
    const dataHtml = Object.entries(r.data || {}).filter(([k]) => !['title', 'eventAt', 'priority', 'locationId', 'performanceClass', 'verificationStatus'].includes(k))
      .map(([k, v]) => `<p><strong>${escapeHtml(k)}:</strong> ${escapeHtml(String(v))}</p>`).join('');

    openModal(r.ref + ' — ' + typeName(r.type), `
      <p><strong>Title:</strong> ${escapeHtml(r.title || '')}</p>
      <p><strong>Status:</strong> <span class="badge badge-${r.status === 'Open' ? 'warning' : 'success'}">${escapeHtml(r.status)}</span>
         · <strong>Priority:</strong> ${escapeHtml(r.priority || '')}</p>
      <p><strong>Event:</strong> ${formatDateTime(r.eventAt)} · <strong>Submitted:</strong> ${formatDateTime(r.createdAt)}</p>
      <p><strong>Location:</strong> ${escapeHtml(loc?.name || '')}</p>
      ${person ? `<p><strong>Personnel:</strong> ${escapeHtml(person.fullName)} (${escapeHtml(person.staffId)})</p>` : '<p class="help-text">No staff member linked — this record will not appear in individual Performance Analytics until linked.</p>'}
      ${asset ? `<p><strong>Asset:</strong> ${escapeHtml(asset.name)} (${escapeHtml(asset.assetId)})</p>` : ''}

      <div class="form-group"><label class="form-label">Performance / conduct classification</label>
        <select class="form-control" id="vr_perfClass">
          ${PERF_CLASS_OPTIONS.map(o => `<option value="${o.id}" ${o.id === currentClass ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">Verification status</label>
        <select class="form-control" id="vr_perfVerify">
          ${PERF_VERIFY_OPTIONS.map(o => `<option value="${o.id}" ${o.id === currentVerify ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">Link to personnel (for Performance Analytics)</label>
        <select class="form-control" id="vr_personId">
          <option value="">— None —</option>
          ${state.personnel.filter(p => p.active !== false && p.status !== 'Archived').map(p =>
            `<option value="${p.id}" ${p.id === r.personId ? 'selected' : ''}>${escapeHtml(p.fullName)} · ${escapeHtml(p.staffId)}</option>`).join('')}
        </select>
        <p class="form-hint">Changing the linked person updates which profile shows this record.</p></div>
      <div class="divider"></div>
      ${dataHtml}
      <div class="divider"></div>
      <p class="text-sm text-secondary">Audit trail</p>
      ${(r.history || []).map(h => `<div class="text-sm">${formatDateTime(h.at)} — ${escapeHtml(h.action)} by ${escapeHtml(h.by)}</div>`).join('')}
    `, `
      <button class="btn btn-secondary" data-action="close-modal">Close</button>
      <button class="btn btn-secondary" data-action="dl-report-html" data-id="${r.id}">Download HTML</button>
      <button class="btn btn-secondary" data-action="dl-report-json" data-id="${r.id}">JSON</button>
      <button class="btn btn-primary" data-action="dl-report-print" data-id="${r.id}">Save as PDF</button>
      <button class="btn btn-primary" data-action="save-report-perf" data-id="${r.id}">Save Classification</button>
      ${r.status === 'Open' ? `<button class="btn btn-success" data-action="close-report" data-id="${r.id}">Mark Closed</button>` : ''}
    `, true);
  }

  document.body.addEventListener('change', async (e) => {
    if (e.target.id !== 'importFile') return;
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || typeof data !== 'object') throw new Error('Invalid backup');
      // Validate before clearing anything
      const present = STORES.filter(s => Array.isArray(data[s]));
      if (!present.length) throw new Error('Backup contains no recognised data stores');
      for (const store of present) {
        const bad = data[store].find(item => !item || typeof item !== 'object' || item.id == null || item.id === '');
        if (bad) throw new Error('Store "' + store + '" has an item without a valid id — restore aborted');
      }
      if (!confirm('Restore will replace local data for: ' + present.join(', ') + '. Continue?')) {
        e.target.value = '';
        return;
      }
      // Snapshot current data first so a mid-restore failure can be recovered from memory in this session
      const snapshot = {};
      for (const s of STORES) snapshot[s] = await getAll(s);
      try {
        for (const store of present) {
          await clearStore(store);
          for (const item of data[store]) await put(store, item);
        }
        await loadAll();
        toast('Backup restored successfully (' + present.length + ' stores)', 'success');
        navigate('overview');
      } catch (inner) {
        // Best-effort rollback from in-memory snapshot
        for (const store of present) {
          try {
            await clearStore(store);
            for (const item of (snapshot[store] || [])) await put(store, item);
          } catch (_) { /* continue */ }
        }
        await loadAll();
        throw new Error('Restore failed mid-write and was rolled back: ' + inner.message);
      }
    } catch (err) {
      toast('Restore failed: ' + err.message, 'error');
    }
    e.target.value = '';
  });

  function monthFuelStats(locId) {
    const mk = monthKey();
    const txs = state.fuelTx.filter(t => {
      if (locId && t.locationId !== locId) return false;
      return (t.createdAt || '').startsWith(mk) || monthKey(new Date(t.createdAt)) === mk;
    });
    const purchases = txs.filter(t => t.txType === 'purchase');
    const issues = txs.filter(t => t.txType === 'issue');
    const totalKegs = purchases.reduce((s, t) => s + (Number(t.kegs) || 0), 0);
    const totalLitres = purchases.reduce((s, t) => s + (Number(t.totalLitres) || 0), 0);
    const totalCost = purchases.reduce((s, t) => s + (Number(t.totalCost) || 0), 0);
    const issuedLitres = issues.reduce((s, t) => s + (Number(t.totalLitres) || 0), 0);
    const avgPerLitre = totalLitres > 0 ? totalCost / totalLitres : 0;
    return { purchases, issues, totalKegs, totalLitres, totalCost, issuedLitres, avgPerLitre, count: purchases.length };
  }

  function monthExpenseStats(locId) {
    const mk = monthKey();
    const exps = state.expenses.filter(e => {
      if (locId && e.locationId !== locId) return false;
      return monthKey(new Date(e.date || e.createdAt)) === mk;
    });
    const expenseOnly = exps.filter(e => e.txKind !== 'income');
    const total = expenseOnly.reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const byCat = {};
    expenseOnly.forEach(e => { byCat[e.category || 'Other'] = (byCat[e.category || 'Other'] || 0) + (Number(e.amount) || 0); });
    return { total, count: expenseOnly.length, byCat, items: expenseOnly };
  }

  async function saveFuelPurchase() {
    const kegs = Number(document.getElementById('fp_kegs')?.value) || 0;
    const per = Number(document.getElementById('fp_perKeg')?.value) || 0;
    if (kegs <= 0 || per <= 0) { toast('Enter valid kegs and litres per keg', 'error'); return; }
    const litres = kegs * per;
    const priceKeg = Number(document.getElementById('fp_priceKeg')?.value);
    const totalPaid = Number(document.getElementById('fp_totalPaid')?.value);
    let cost = 0;
    if (!isNaN(totalPaid) && totalPaid > 0) cost = totalPaid;
    else if (!isNaN(priceKeg) && priceKeg > 0) cost = kegs * priceKeg;
    const locationId = document.getElementById('fp_locationId')?.value || state.currentLocationId;
    const tx = {
      id: uid(),
      ref: refNo('FUL'),
      txType: 'purchase',
      locationId,
      assetId: document.getElementById('fp_assetId')?.value || null,
      kegs, litresPerKeg: per, totalLitres: litres, totalCost: cost,
      unitCost: litres > 0 ? cost / litres : 0,
      supplier: document.getElementById('fp_supplier')?.value || '',
      receipt: document.getElementById('fp_receipt')?.value || '',
      authorisedBy: document.getElementById('fp_auth')?.value || '',
      receivedBy: document.getElementById('fp_received')?.value || '',
      notes: document.getElementById('fp_notes')?.value || '',
      createdAt: nowISO(),
      history: [{ at: nowISO(), action: 'Created', by: state.settings.supervisorName || 'Field Supervisor' }]
    };
    await put('fuelTx', tx);
    state.fuelTx.push(tx);
    // Update inventory
    const stock = await ensureFuelStock(locationId);
    stock.balanceLitres = (Number(stock.balanceLitres) || 0) + litres;
    stock.updatedAt = nowISO();
    stock.history = stock.history || [];
    stock.history.push({ at: nowISO(), action: 'purchase', litres, ref: tx.ref, balance: stock.balanceLitres });
    await put('fuelStock', stock);
    // Also record as expense (diesel) — single expense entry linked to this purchase
    const expense = {
      id: uid(), ref: refNo('EXP'), category: 'Diesel', amount: cost, date: nowISO(),
      locationId, assetId: tx.assetId, description: `Diesel purchase ${tx.ref}: ${kegs} kegs × ${per}L = ${litres}L`,
      supplier: tx.supplier, receipt: tx.receipt, fuelTxId: tx.id,
      status: 'Recorded', createdAt: nowISO(),
      history: [{ at: nowISO(), action: 'Created', by: state.settings.supervisorName || 'Field Supervisor' }]
    };
    await put('expenses', expense);
    state.expenses.push(expense);
    closeModal();
    toast(`Purchase saved: ${litres.toFixed(1)} L · ${formatMoney(cost)}`, 'success');
    if (state.currentPage === 'finance' || state.currentPage === 'overview') renderPage();
  }

  function showFuelIssueForm() {
    const gens = state.assets.filter(a => a.category === 'Generator');
    const stock = getFuelStock(state.currentLocationId);
    openModal('Issue Fuel to Generator', `
      <p class="help-text">Issue fuel from inventory to a generator. Current book balance: <strong>${(stock.balanceLitres || 0).toFixed(1)} L</strong></p>
      <div class="form-group"><label class="form-label">Generator <span class="req">*</span></label>
        <select class="form-control" id="fi_assetId">
          <option value="">Select generator…</option>
          ${gens.map(a => `<option value="${a.id}">${escapeHtml(a.name)} (${escapeHtml(a.assetId)})</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">Litres issued <span class="req">*</span></label>
        <input class="form-control" type="number" id="fi_litres" min="0.1" step="0.1"></div>
      <div class="form-group"><label class="form-label">Issued by</label>
        <input class="form-control" id="fi_by"></div>
      <div class="form-group"><label class="form-label">Notes</label>
        <textarea class="form-control" id="fi_notes"></textarea></div>
    `, `<button class="btn btn-secondary" data-action="close-modal">Cancel</button>
        <button class="btn btn-primary" data-action="save-fuel-issue">Issue Fuel</button>`);
  }

  async function saveFuelIssue() {
    const assetId = document.getElementById('fi_assetId')?.value;
    const litres = Number(document.getElementById('fi_litres')?.value) || 0;
    if (!assetId || litres <= 0) { toast('Select generator and enter litres', 'error'); return; }
    const asset = state.assets.find(a => a.id === assetId);
    // Deduct from the site inventory where the generator is registered (fallback: current site)
    const locationId = asset?.locationId || state.currentLocationId;
    const stock = await ensureFuelStock(locationId);
    if (litres > (stock.balanceLitres || 0) + 0.01) {
      toast('Insufficient book balance. Record a purchase or physical adjustment first.', 'error');
      return;
    }
    const tx = {
      id: uid(), ref: refNo('FIS'), txType: 'issue', locationId, assetId,
      totalLitres: litres, issuedBy: document.getElementById('fi_by')?.value || '',
      notes: document.getElementById('fi_notes')?.value || '',
      createdAt: nowISO(),
      history: [{ at: nowISO(), action: 'Created', by: state.settings.supervisorName || 'Field Supervisor' }]
    };
    await put('fuelTx', tx);
    state.fuelTx.push(tx);
    stock.balanceLitres = (Number(stock.balanceLitres) || 0) - litres;
    stock.updatedAt = nowISO();
    stock.history = stock.history || [];
    stock.history.push({ at: nowISO(), action: 'issue', litres: -litres, ref: tx.ref, balance: stock.balanceLitres });
    await put('fuelStock', stock);
    closeModal();
    toast(`Issued ${litres.toFixed(1)} L to generator`, 'success');
    renderPage();
  }

  function showPhysicalStockForm() {
    const stock = getFuelStock(state.currentLocationId);
    openModal('Physical Fuel Stock Count', `
      <p class="help-text">Enter the physically measured fuel quantity. The system compares it to the book balance and flags any variance for review.</p>
      <p><strong>Current book balance:</strong> ${(stock.balanceLitres || 0).toFixed(1)} litres</p>
      <div class="form-group"><label class="form-label">Measured quantity (litres) <span class="req">*</span></label>
        <input class="form-control" type="number" id="ph_litres" min="0" step="0.1" value="${stock.balanceLitres || 0}"></div>
      <div class="form-group"><label class="form-label">Counted by</label>
        <input class="form-control" id="ph_by"></div>
      <div class="form-group"><label class="form-label">Notes / explanation</label>
        <textarea class="form-control" id="ph_notes" placeholder="Optional explanation if variance is expected"></textarea></div>
    `, `<button class="btn btn-secondary" data-action="close-modal">Cancel</button>
        <button class="btn btn-primary" data-action="save-physical-stock">Save Count</button>`);
  }

  async function savePhysicalStock() {
    const measured = Number(document.getElementById('ph_litres')?.value);
    if (isNaN(measured) || measured < 0) { toast('Enter a valid measured quantity', 'error'); return; }
    const locationId = state.currentLocationId;
    const stock = await ensureFuelStock(locationId);
    const book = Number(stock.balanceLitres) || 0;
    const variance = measured - book;
    const tx = {
      id: uid(), ref: refNo('FPH'), txType: 'physical', locationId,
      totalLitres: measured, bookBalance: book, variance,
      countedBy: document.getElementById('ph_by')?.value || '',
      notes: document.getElementById('ph_notes')?.value || '',
      createdAt: nowISO(),
      history: [{ at: nowISO(), action: 'Created', by: state.settings.supervisorName || 'Field Supervisor' }]
    };
    await put('fuelTx', tx);
    state.fuelTx.push(tx);
    // Adjustment: set balance to measured
    stock.balanceLitres = measured;
    stock.updatedAt = nowISO();
    stock.history = stock.history || [];
    stock.history.push({ at: nowISO(), action: 'physical', litres: measured, variance, ref: tx.ref, balance: measured });
    await put('fuelStock', stock);
    // Flag variance if significant (>1L)
    if (Math.abs(variance) > 1) {
      await createAlert({
        title: `Fuel variance: ${variance > 0 ? '+' : ''}${variance.toFixed(1)} L at ${currentLocation()?.name || 'site'}`,
        severity: Math.abs(variance) > 20 ? 'critical' : 'warning',
        reason: `Physical count ${measured.toFixed(1)} L vs book balance ${book.toFixed(1)} L. Classification: Unreconciled variance — pending verification.`,
        relatedType: 'fuel', relatedId: tx.id, locationId,
        suggestedAction: 'Review recent purchases and issues. Confirm measurement method. Record authorised adjustment if required. Do not assume theft without investigation.'
      });
    }
    closeModal();
    toast(Math.abs(variance) > 1 ? `Stock updated. Variance of ${variance.toFixed(1)} L flagged for review.` : 'Physical count matches book balance.', Math.abs(variance) > 1 ? 'warning' : 'success');
    updateAttentionBadge();
    renderPage();
  }

  function showExpenseForm() {
    openModal('Record Operational Expense', `
      <p class="help-text">Record an operational expense. Diesel purchases are already logged as expenses when you record a fuel purchase — avoid double-counting.</p>
      <div class="form-group"><label class="form-label">Category <span class="req">*</span></label>
        <select class="form-control" id="ex_category">
          <option>Generator Maintenance</option><option>Equipment Repair</option><option>Replacement Parts</option>
          <option>Security Equipment</option><option>Batteries</option><option>Lighting</option>
          <option>Communication</option><option>Cleaning & Supplies</option><option>Petrol</option>
          <option>Other</option>
        </select></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Amount (₦) <span class="req">*</span> ${infoBtn('amount')}</label>
          <input class="form-control" type="number" id="ex_amount" min="0" step="0.01" placeholder="e.g. 25000"></div>
        <div class="form-group"><label class="form-label">Date</label>
          <input class="form-control" type="date" id="ex_date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="form-group"><label class="form-label">Description</label>
        <textarea class="form-control" id="ex_desc"></textarea></div>
      <div class="form-group"><label class="form-label">Location</label>
        <select class="form-control" id="ex_locationId">
          ${state.locations.filter(l => l.active !== false).map(l => `<option value="${l.id}" ${l.id === state.currentLocationId ? 'selected' : ''}>${escapeHtml(l.name)}</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">Related asset (optional)</label>
        <select class="form-control" id="ex_assetId">
          <option value="">None</option>
          ${state.assets.filter(a => a.active !== false).map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">Supplier ${infoBtn('supplier')}</label>
        <input class="form-control" id="ex_supplier" placeholder="e.g. ABC Energy Services"></div>
      <div class="form-group"><label class="form-label">Receipt / reference ${infoBtn('receipt')}</label>
        <input class="form-control" id="ex_receipt" placeholder="e.g. INV-2026-001"></div>
      <div class="form-group"><label class="form-label">Authorised by</label>
        <input class="form-control" id="ex_auth"></div>
    `, `<button class="btn btn-secondary" data-action="close-modal">Cancel</button>
        <button class="btn btn-primary" data-action="save-expense">Save Expense</button>`);
  }

  async function saveExpense() {
    const amount = Number(document.getElementById('ex_amount')?.value);
    if (isNaN(amount) || amount < 0) { toast('Enter a valid amount', 'error'); return; }
    const expense = {
      id: uid(), ref: refNo('EXP'),
      category: document.getElementById('ex_category')?.value || 'Other',
      amount, date: document.getElementById('ex_date')?.value || nowISO(),
      locationId: document.getElementById('ex_locationId')?.value || state.currentLocationId,
      assetId: document.getElementById('ex_assetId')?.value || null,
      description: document.getElementById('ex_desc')?.value || '',
      supplier: document.getElementById('ex_supplier')?.value || '',
      receipt: document.getElementById('ex_receipt')?.value || '',
      authorisedBy: document.getElementById('ex_auth')?.value || '',
      status: 'Recorded', createdAt: nowISO(),
      history: [{ at: nowISO(), action: 'Created', by: state.settings.supervisorName || 'Field Supervisor' }]
    };
    await put('expenses', expense);
    state.expenses.push(expense);
    closeModal();
    toast('Expense recorded: ' + formatMoney(amount), 'success');
    renderPage();
  }

  function exportExpensesCSV() {
    const rows = [['ref','category','amount','date','location','description','supplier','receipt']];
    state.expenses.forEach(e => {
      const loc = state.locations.find(l => l.id === e.locationId);
      rows.push([e.ref, e.category, e.amount, e.date || e.createdAt, loc?.name || '', `"${(e.description||'').replace(/"/g,'""')}"`, e.supplier || '', e.receipt || '']);
    });
    const csv = rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `SentinelDesk-expenses-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Expenses exported', 'success');
  }



  document.addEventListener('change', e => {
    if (e.target.id === 'perfPeriodSelect') {
      state.perfPeriod = e.target.value;
      renderPage();
    }
    if (e.target.id === 'assetPerfPeriodSelect') {
      state.assetPerfPeriod = e.target.value;
      renderPage();
    }
    if (e.target.id === 'attPeriodSelect') {
      state.attPeriod = e.target.value;
      renderPage();
    }
    if (e.target.id === 'rw_title' || e.target.id === 'rw_perfClass') {
      // Suggest classification from title when person may be linked
      const titleEl = document.getElementById('rw_title');
      const classEl = document.getElementById('rw_perfClass');
      const hint = document.getElementById('rw_perfSuggest');
      if (classEl && titleEl && e.target.id === 'rw_title') {
        const sug = suggestPerformanceClass(titleEl.value);
        if (sug.confidence >= 0.6 && classEl.value === 'neutral') {
          classEl.value = sug.id;
        }
        if (hint) hint.textContent = sug.note + (sug.confidence >= 0.6 ? ' (suggested: ' + sug.id + ' — confirm before save)' : '');
      }
    }
  });

  // ========== BOOT ==========
  async function init() {
    try {
      await openDB();
      await seedIfEmpty();
      await loadAll();
      // Recover any leave requests whose attendance sync did not complete
      try { await recoverIncompleteLeaveSyncs(); } catch (e) { console.error(e); }
      const savedTheme = LS.get('theme') || 'system';
      applyTheme(savedTheme);
      updateClock();
      setInterval(updateClock, 30000);
      navigate('overview');
      showOnboardingIfNeeded();
      console.log('SentinelDesk upgraded ready');
    } catch (err) {
      console.error(err);
      document.getElementById('mainContent').innerHTML = `
        <div class="page active"><div class="card"><div class="card-body">
          <h2>Unable to start</h2>
          <p class="text-secondary">IndexedDB is required. ${escapeHtml(err.message)}</p>
        </div></div></div>`;
    }
  }

  init();
})();
</script>
